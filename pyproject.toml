[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-os"
version = "1.0.0"
description = "Universal Portable Hardware Intelligence Platform"
readme = "docs/SCHEMA_CONTRACT.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pynacl>=1.5.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.25.0",
    "reportlab>=4.0.0"
]

[tool.setuptools.package-dir]
ghost_core = "ghost-core"
ghost_vault = "ghost-vault"
ghost_ai = "ghost-ai"
linux_os = "linux-os"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
